name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  integration:
    # Plays the arrs' webhooks against a real, throwaway Jellyfin 12.2 server (tests/integration).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build src/Jellyfin.Plugin.ArrRefresh -c Release
      - run: python3 tests/integration/sandbox_test.py src/Jellyfin.Plugin.ArrRefresh/bin/Release/net10.0/Jellyfin.Plugin.ArrRefresh.dll
